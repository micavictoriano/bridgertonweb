<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#eac0cc">
        <meta name="description" content="Los secretos de la moda de la alta sociedad de Bridgerton.">
        <title>Glamour | The Whistledown</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./bridgerton.css">
        <link rel="stylesheet" href="./glamour.css">
    </head>
    <body class="glamour-page">
        <header class="topbar">
            <a class="icon-button menu-button home-button" href="./bridgerton.html" aria-label="Volver al inicio">
                <span></span><span></span><span></span>
            </a>
            <form class="search" role="search" action="#" onsubmit="return false">
                <label class="visually-hidden" for="site-search">Buscar en The Whistledown</label>
                <input id="site-search" type="search" placeholder="Buscar">
                <button class="search-button" type="submit" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
                </button>
            </form>
            <button class="icon-button profile-button" type="button" aria-label="Perfil">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="9" r="3"></circle><path d="M5.8 19a6.4 6.4 0 0 1 12.4 0"></path></svg>
            </button>
        </header>

        <main>
            <header class="glamour-masthead">
                <h1>Glamour</h1>
                <p>Los secretos de la moda de la alta sociedad, al descubierto</p>
                <img class="glamour-feature" src="./daphne%20glamour.jpg" alt="Daphne Bridgerton con un vestido de gala y antifaz">
            </header>

            <section class="glamour-sections" aria-label="Moda y estilo">
                <article class="glamour-card">
                    <h2>Accesorios y belleza</h2>
                    <img src="./accesorios.jpg" alt="Abanico de encaje y guante de época">
                </article>
                <article class="glamour-card">
                    <h2>Look destacado</h2>
                    <img src="./sophie%20mejor%20vestido.jpg" alt="Vestido de gala plateado en un jardín">
                </article>
                <article class="glamour-card">
                    <h2>Mejores vestidos</h2>
                    <img src="./vestuario.jpg" alt="Vestidos y trajes de época en una sala de vestuario">
                </article>
            </section>
        </main>

        <footer class="social-footer">
            <a href="https://www.instagram.com/bridgertonnetflix/" aria-label="Instagram de Bridgerton">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="instagram-dot" cx="18" cy="6" r="1"></circle></svg>
                <span>@BRIDGERTONNETFLIX</span>
            </a>
        </footer>
    </body>
</html>
